# Production database on the VPS (the app itself runs on Vercel). See docs/09-deployment-ops.md.
# TLS is mandatory: deploy/pg_hba.conf only accepts hostssl connections from outside.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: simaset
      POSTGRES_USER: simaset
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/fullchain.pem
      - -c
      - ssl_key_file=/certs/privkey.pem
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=60
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simaset"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
