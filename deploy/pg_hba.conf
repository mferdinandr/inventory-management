# TYPE   DATABASE USER ADDRESS        METHOD
# Inside the container (docker compose exec, backups, healthcheck).
local    all      all                 trust
host     all      all  127.0.0.1/32   scram-sha-256
host     all      all  ::1/128        scram-sha-256
# From the internet (Vercel): TLS only, password required. Plain `host` rows would let
# unencrypted connections in, so there are none.
hostssl  all      all  0.0.0.0/0      scram-sha-256
hostssl  all      all  ::/0           scram-sha-256
