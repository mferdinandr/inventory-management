name: Deploy

# Runs after CI passes on main. Does nothing until the VPS secrets are set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "DEPLOY_HOST/DEPLOY_USER not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "cd '${DEPLOY_PATH:-/opt/simaset}' && scripts/deploy.sh"
      - name: Health check
        if: steps.check.outputs.skip != 'true' && vars.DEPLOY_URL != ''
        run: curl --fail --retry 10 --retry-delay 6 --retry-connrefused "${{ vars.DEPLOY_URL }}/api/health"
